name: Build Android APK

# Yeh workflow tab chalega jab bhi 'main' branch par
# artifacts/english-speaking-practice/android/ folder mein koi change push hoga,
# ya jab aap manually "Run workflow" dabayenge.
on:
  push:
    branches: [ main ]
    paths:
      - 'artifacts/english-speaking-practice/android/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug & release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/english-speaking-practice/android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Release build sirf tab chalega jab aap ne signing secrets set kiye hon
      # (neeche instructions mein bataya gaya hai). Agar nahi kiye, is step ko
      # hata dein ya jaise hai waisa chhod dein — yeh sirf tab fail hoga
      # jab aap 'assembleRelease' khud trigger karein.
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: artifacts/english-speaking-practice/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/english-speaking-practice/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
