openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: English practice conversation
  - name: practice
    description: Premium practice, progress, lessons, and billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the English practice partner
      description: Returns a concise, encouraging AI reply using the current session conversation as context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageResponse"
        "400":
          description: Invalid message
        "500":
          description: AI service error
  /session:
    get:
      operationId: getPracticeSession
      tags: [practice]
      summary: Get account or device session entitlement and daily usage
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /account/export:
    get:
      operationId: exportAccountData
      tags: [practice]
      summary: Export the signed-in learner's account data
      responses:
        "200":
          description: Portable account data
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { description: Sign-in required }
  /account:
    delete:
      operationId: deleteAccount
      tags: [practice]
      summary: Permanently delete the signed-in learner and all learning data
      responses:
        "204": { description: Account deleted }
        "401": { description: Sign-in required }
  /subscription:
    get:
      operationId: getCurrentSubscription
      tags: [practice]
      summary: Get independently tracked subscriptions for both learning boxes
      responses:
        "200":
          description: Current subscription details or empty free-user state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SubscriptionDetails"
                  - $ref: "#/components/schemas/EmptySubscription"
  /subscription/cancel:
    post:
      operationId: cancelCurrentSubscription
      tags: [practice]
      summary: Schedule cancellation at the end of the current trial or billing period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boxId]
              properties:
                boxId: { type: string, enum: [read_write, audio_first] }
      responses:
        "200":
          description: Cancellation scheduled without removing current access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancellationResponse" }
        "404": { description: No active subscription }
        "409": { description: Cancellation already pending or unsupported provider }
        "503": { description: Provider credentials missing }
  /voice:
    post:
      operationId: sendVoiceConversation
      tags: [practice]
      summary: Send audio for premium voice conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioBase64]
              properties:
                audioBase64: { type: string }
                mimeType: { type: string }
                scenario: { type: string }
                history:
                  type: array
                  items: { $ref: "#/components/schemas/ChatMessage" }
      responses:
        "200":
          description: Audio response and transcripts
          content:
            application/json:
              schema:
                type: object
                required: [userTranscript, assistantTranscript, audioBase64]
                properties:
                  userTranscript: { type: string }
                  assistantTranscript: { type: string }
                  audioBase64: { type: string }
                  audioMimeType: { type: string }
                  secondsUsed: { type: number }
        "402": { description: Premium required }
        "429": { description: Daily voice limit reached }
  /correct:
    post:
      operationId: correctPracticeSentence
      tags: [practice]
      summary: Return immediate English correction with Roman Hindi or Urdu explanation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                mode: { type: string, enum: [soft, strict] }
      responses:
        "200":
          description: Structured correction
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /translate:
    post:
      operationId: translatePracticeText
      tags: [practice]
      summary: Translate English and Roman Hindi or Urdu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                direction: { type: string }
      responses:
        "200":
          description: Translation
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /pronunciation:
    post:
      operationId: assessPronunciation
      tags: [practice]
      summary: Score pronunciation through the configured Language Confidence provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, audioBase64, mimeType]
              properties:
                text: { type: string }
                audioBase64: { type: string }
                mimeType: { type: string }
      responses:
        "200":
          description: Canonical pronunciation assessment
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /roleplays:
    get:
      operationId: listRoleplayScenarios
      tags: [practice]
      summary: List supported roleplay scenarios
      responses:
        "200":
          description: Roleplay catalog
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /roleplays/{scenario}:
    post:
      operationId: sendRoleplayMessage
      tags: [practice]
      summary: Send a roleplay message
      parameters:
        - name: scenario
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200":
          description: Roleplay reply and correction
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /lessons:
    get:
      operationId: listDailyLessons
      tags: [practice]
      summary: List structured 10-15 minute lessons by level
      responses:
        "200":
          description: Lesson catalog
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /lessons/{lessonId}/attempt:
    post:
      operationId: recordLessonAttempt
      tags: [practice]
      summary: Record a lesson attempt and return completion progress
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes: { type: number, minimum: 1, maximum: 15 }
      responses:
        "200":
          description: Lesson progress
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /progress:
    get:
      operationId: getPracticeProgress
      tags: [practice]
      summary: Get persisted practice progress
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /weekly-report:
    get:
      operationId: getWeeklyPracticeReport
      tags: [practice]
      summary: Get the persisted seven-day practice report
      responses:
        "200":
          description: Weekly report
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /plans:
    get:
      operationId: listPremiumPlans
      tags: [practice]
      summary: List trial and premium plan pricing
      responses:
        "200":
          description: Pricing
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /payment-options:
    get:
      operationId: listPaymentOptions
      tags: [practice]
      summary: List payment methods by country
      parameters:
        - name: country
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Available provider options
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /checkout:
    post:
      operationId: createPremiumCheckout
      tags: [practice]
      summary: Create a provider checkout for one independently billed learning box
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, plan, boxId]
              properties:
                provider: { type: string, enum: [phonepe] }
                plan: { type: string, enum: [monthly, quarterly, yearly] }
                boxId: { type: string, enum: [read_write, audio_first] }
                country: { type: string }
      responses:
        "200": { description: Checkout created }
        "503": { description: Provider not configured }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
      required: [role, content]
    ChatMessageInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
      required: [message]
    ChatMessageResponse:
      type: object
      properties:
        reply:
          type: string
      required: [reply]
    SubscriptionDetails:
      type: object
      required: [provider, plan, status, providerStatus, providerSubscriptionId, cancelPending]
      properties:
        provider: { type: string, enum: [phonepe] }
        plan: { type: string }
        status: { type: string, enum: [trialing, active, cancel_pending] }
        providerStatus: { type: string }
        providerSubscriptionId: { type: string }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEndsAt: { type: string, format: date-time, nullable: true }
        cancelPending: { type: boolean }
    EmptySubscription:
      type: object
      required: [subscription, status]
      properties:
        subscription: { type: "null" }
        status: { type: string, enum: [none] }
    CancellationResponse:
      type: object
      required: [provider, status]
      properties:
        provider: { type: string, enum: [phonepe] }
        status: { type: string, enum: [cancel_pending] }
        cancelAtPeriodEnd: { type: boolean }
        cancelAtCycleEnd: { type: boolean }
        accessUntil: { type: string, format: date-time, nullable: true }

